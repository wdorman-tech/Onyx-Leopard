[project]
name = "onyx-leopard-backend"
version = "0.4.0"
description = "Onyx Leopard business simulation — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2",
    "httpx>=0.27",
    "python-dotenv>=1",
    "numpy>=2",
    "scipy>=1.14",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running test (e.g. multi-year sim); deselect with `-m \"not slow\"`",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
